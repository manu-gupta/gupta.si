<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Gupta Consulting — Advisory, Investments, Tech, Research.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Gupta Consulting</title>

  <!-- Favicon: exact logo-mark PNGs first, with SVG/ICO fallbacks -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="shortcut icon" href="assets/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">

  <style>
    * { box-sizing: border-box; }

    :root {
      --navy: #071b4d;
      --gold: #c58b1c;
      --muted: #7a7f8a;
      --page-pad: clamp(24px, 5vw, 64px);
    }

    html, body {
      margin: 0;
      min-height: 100%;
      width: 100%;
      background: #fff;
    }

    body {
      min-height: 100svh;
      color: #0a0a0a;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
    }

    .page {
      min-height: 100svh;
      width: min(100%, 1280px);
      margin: 0 auto;
      padding: calc(env(safe-area-inset-top) + 26px) var(--page-pad)
               calc(env(safe-area-inset-bottom) + 26px);
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 32px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: inherit;
      min-width: 0;
    }

    .brand-mark {
      width: clamp(34px, 4vw, 42px);
      height: clamp(34px, 4vw, 42px);
      flex: 0 0 auto;
      object-fit: contain;
      display: block;
    }

    .domain {
      font-size: clamp(14px, 1.4vw, 16px);
      line-height: 1;
      font-weight: 500;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .descriptor {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--gold);
      font-size: 10px;
      line-height: 1;
      font-weight: 600;
      letter-spacing: .18em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .descriptor .dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--gold);
      flex: 0 0 auto;
    }

    main {
      display: grid;
      place-items: center;
      text-align: center;
      padding: 20px 0;
    }

    .hero {
      width: min(100%, 920px);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hero-mark {
      width: clamp(62px, 8vw, 92px);
      height: clamp(62px, 8vw, 92px);
      object-fit: contain;
      display: block;
      margin-bottom: clamp(28px, 4.5vh, 48px);
    }

    .quote {
      margin: 0;
      max-width: 900px;
      font-size: clamp(44px, 7.1vw, 88px);
      font-weight: 400;
      line-height: .98;
      letter-spacing: -.058em;
      text-wrap: balance;
    }

    .subline {
      margin: clamp(34px, 5vh, 54px) 0 0;
      color: var(--navy);
      font-size: clamp(10px, 1.2vw, 12px);
      line-height: 1.4;
      font-weight: 500;
      letter-spacing: .17em;
      text-transform: uppercase;
    }

    .subline span { color: var(--gold); padding: 0 .45em; }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      letter-spacing: -.01em;
    }

    .footer .year { white-space: nowrap; }

    @media (max-width: 700px) {
      .page {
        gap: 20px;
        padding-left: max(20px, var(--page-pad));
        padding-right: max(20px, var(--page-pad));
      }

      .descriptor { display: none; }

      main { padding: 8px 0; }

      .hero-mark { margin-bottom: 30px; }

      .quote {
        max-width: 12ch;
        font-size: clamp(42px, 12.8vw, 64px);
        line-height: 1.01;
        letter-spacing: -.055em;
      }

      .subline {
        max-width: 300px;
        line-height: 1.8;
      }
    }

    @media (max-height: 650px) and (min-width: 701px) {
      .page { gap: 16px; }
      .hero-mark { margin-bottom: 18px; }
      .subline { margin-top: 22px; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .hero-mark { animation: mark-in 900ms cubic-bezier(.16,1,.3,1) both; }
      .quote { animation: quote-in 950ms 90ms cubic-bezier(.16,1,.3,1) both; }
      .subline { animation: fade-in 700ms 220ms ease both; }
    }

    @keyframes mark-in {
      from { opacity: 0; transform: translateY(10px) scale(.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes quote-in {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>

<body>
  <div class="page">
    <header class="header">
      <a class="brand" href="/" aria-label="Gupta.si home">
        <img class="brand-mark" src="assets/gupta-mark.png" alt="Gupta Consulting mark" width="42" height="42">
        <span class="domain">gupta.si</span>
      </a>

      <div class="descriptor" aria-label="Gupta Consulting services">
        <span>Gupta Consulting</span>
        <span class="dot" aria-hidden="true"></span>
        <span>Advisory · Investments · Tech · Research</span>
      </div>
    </header>

    <main>
      <section class="hero" aria-labelledby="hero-quote">
        <img class="hero-mark" src="assets/gupta-mark.png" alt="Gupta Consulting logo mark" width="92" height="92">
        <h1 id="hero-quote" class="quote">The impossible is usually just the unexplored.</h1>
        <p class="subline">Advisory <span>|</span> Investments <span>|</span> Tech <span>|</span> Research</p>
      </section>
    </main>

    <footer class="footer">
      <span>Namaste</span>
      <span class="year">© 2026</span>
    </footer>
  </div>
</body>
</html>
