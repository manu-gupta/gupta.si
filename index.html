<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>gupta.si</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      background: #fff;
      color: #000;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    main {
      width: 100%;
      max-width: 1100px;
      padding: 40px;
      text-align: center;
    }

    .domain {
      position: fixed;
      top: 32px;
      left: 40px;

      font-size: 15px;
      font-weight: 500;
      letter-spacing: -0.02em;
    }

    .quote {
      margin: 0 auto;

      max-width: 850px;

      font-size: clamp(42px, 6vw, 82px);
      font-weight: 400;
      line-height: 0.98;
      letter-spacing: -0.055em;
    }

    .footer {
      position: fixed;
      bottom: 32px;
      left: 40px;

      font-size: 13px;
      color: #777;
      letter-spacing: -0.01em;
    }

    @media (max-width: 600px) {
      .domain {
        top: 24px;
        left: 24px;
      }

      .footer {
        bottom: 24px;
        left: 24px;
      }

      main {
        padding: 24px;
      }

      .quote {
        font-size: clamp(38px, 12vw, 60px);
      }
    }
  </style>
</head>

<body>

  <div class="domain">
    gupta.si
  </div>

  <main>
    <h1 class="quote">
      The impossible is usually just the unexplored.
    </h1>
  </main>

  <div class="footer">
    © 2026
  </div>

</body>
</html>
